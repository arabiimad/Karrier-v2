<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="karrier-logo.png" type="image/png">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --paper: #EEF1F4; --card: #FFFFFF; --ink: #16181B; --ink-2: #4B5058; --ink-3: #6B717A;
            --rule: #CBD2DB; --blue: #1B4DB8; --wa: #1E7A4C; --wa-ink: #165E3A; --danger: #B4351F; --mark: #FFE36E;
            --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
            --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
            /* older names still used inline by the script */
            --warning: var(--danger); --success: var(--wa); --muted: var(--ink-3);
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #121314; --card: #1C1D20; --ink: #EDEAE3; --ink-2: #B3AFA7; --ink-3: #86837D;
                --rule: #2D2F33; --blue: #86A6FF; --wa: #4CC38A; --wa-ink: #6FD6A3; --danger: #F08A73; --mark: #4A3F0A;
                color-scheme: dark;
            }
        }
        body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 48px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        .track-card { width: 100%; max-width: 560px; }
        .track-logo { width: 30px; height: 30px; border-radius: 7px; margin-bottom: 28px; }
        .track-card h1 { font-size: clamp(30px, 6vw, 40px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; }
        .track-subtitle { color: var(--ink-2); margin: 10px 0 28px; }
        #trackContent { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; }
        .progress-container { margin-bottom: 18px; }
        .progress-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
        .progress-labels span.active-label { color: var(--ink); font-weight: 600; }
        .progress-labels span.done-label { color: var(--ink-2); }
        .progress-track { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--ink); transition: width .6s ease; }
        .progress-fill.done { background: var(--wa); }
        .eta-badge { display: inline-block; font-family: var(--mono); font-size: 13px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px; margin-bottom: 22px; color: var(--ink-2); }
        .eta-badge.done { border-color: var(--wa); color: var(--wa); }
        .eta-badge.refunded { border-color: var(--danger); color: var(--danger); }
        .status-timeline { margin-bottom: 22px; }
        .timeline-step { display: flex; align-items: flex-start; gap: 14px; position: relative; padding-bottom: 20px; }
        .timeline-step:last-child { padding-bottom: 0; }
        .timeline-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--card); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink-3); flex-shrink: 0; position: relative; z-index: 1; }
        .timeline-step.active .timeline-dot { border-color: var(--ink); background: var(--ink); color: var(--paper); }
        .timeline-step.completed .timeline-dot { border-color: var(--ink); color: var(--ink); }
        .timeline-line { position: absolute; left: 13px; top: 28px; width: 1px; height: calc(100% - 28px); background: var(--rule); }
        .timeline-step:last-child .timeline-line { display: none; }
        .timeline-info h3 { font-size: 16px; font-weight: 700; color: var(--ink-3); padding-top: 3px; }
        .timeline-info p { font-size: 14px; color: var(--ink-3); }
        .timeline-step.active .timeline-info h3, .timeline-step.completed .timeline-info h3 { color: var(--ink); }
        .timeline-step.active .timeline-info p { color: var(--ink-2); }
        .order-details { border-top: 1px dashed var(--rule); padding-top: 14px; font-family: var(--mono); font-size: 13px; }
        .detail-row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; }
        .detail-label { color: var(--ink-3); }
        .detail-val { color: var(--ink); text-align: right; }
        .notice { margin: 0 0 22px; padding: 14px 16px; border-left: 3px solid var(--mark); background: var(--paper); font-size: 15px; color: var(--ink-2); }
        .notice strong { display: block; color: var(--ink); margin-bottom: 2px; }
        .notice.refunded { border-left-color: var(--danger); }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 18px; border-radius: 6px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
        .btn-wa { background: var(--wa); color: #fff; border: 1.5px solid var(--wa); }
        .btn-wa:hover { background: var(--wa-ink); border-color: var(--wa-ink); }
        .btn-ghost { border: 1.5px solid var(--ink); color: var(--ink); background: transparent; }
        .btn-ghost:hover { background: var(--ink); color: var(--paper); }
        .referral-section { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--rule); }
        .referral-section h3 { font-size: 17px; margin-bottom: 4px; }
        .referral-section p { font-size: 14px; color: var(--ink-2); margin-bottom: 12px; }
        .referral-code-box { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .referral-code { flex: 1; font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: .08em; padding: 10px 12px; border: 1.5px dashed var(--ink); border-radius: 6px; }
        .copy-btn { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
        .copy-btn:hover { background: var(--ink); color: var(--paper); }
        .poll-info { margin-top: 16px; font-size: 13px; color: var(--ink-3); }
        .poll-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--wa); margin-right: 4px; vertical-align: middle; }
        .help { margin-top: 18px; font-size: 14px; color: var(--ink-2); }
        .help a { color: var(--ink); font-weight: 600; }
        .back-link { display: inline-block; margin-top: 22px; color: var(--ink-2); font-size: 15px; }
        .back-link:hover { color: var(--ink); }
        .track-loading { color: var(--ink-3); }
        .track-error { color: var(--danger); }
        .track-form label { display: block; font-weight: 600; margin-bottom: 6px; }
        .track-form .row { display: flex; gap: 8px; }
        .track-form input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border: 1.5px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 16px; text-transform: uppercase; }
        .track-form input:focus { outline: none; border-color: var(--blue); }
        .track-form button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .track-form p { margin-top: 8px; font-size: 13px; color: var(--ink-3); }
        @media (prefers-color-scheme: dark) { .track-form button, .btn-wa { color: #0E1320; } }
        @media (max-width: 480px) { #trackContent { padding: 18px 16px; } }
    </style>
</head>

            },
            de: {

                d4wait: 'Jetzt per WhatsApp zahlbar, da Premium aktiv ist.', d4: 'Zahlung erhalten, vielen Dank.',
                nowPending: 'Wir bereiten den sicheren Link für Ihr Passwort vor.',
                nowLink: 'Der sichere Link ist in Ihrem Postfach. Prüfen Sie auch den Spam-Ordner.',
                nowActivating: 'Die Aktivierung läuft. Falls LinkedIn Ihnen einen Bestätigungscode schickt, senden Sie ihn uns bitte auf WhatsApp.',

        var LOCALES = { fr: 'fr-FR', en: 'en-GB', es: 'es-ES', de: 'de-DE' };
        var params = new URLSearchParams(window.location.search);
        var lookup = params.get('id') || params.get('session_id') || params.get('ref');
        var lang = pickLang(params.get('lang'));
        var t = T[lang];
        var container = document.getElementById('trackContent');
        var pollTimer = null;

        function pickLang(hint) {
            var candidates = [hint];
            try { candidates.push(localStorage.getItem('kareer_lang')); } catch (e) {}
            candidates.push((navigator.language || '').slice(0, 2));
            for (var i = 0; i < candidates.length; i++) if (candidates[i] && T[candidates[i]]) return candidates[i];
            return 'fr';
        }
        function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
        }
        function money(order) {
            return new Intl.NumberFormat(LOCALES[lang], { style: 'currency', currency: order.currency || 'EUR', minimumFractionDigits: Number.isInteger(order.amount) ? 0 : 2 }).format(order.amount || 0);
        }
        function date(value) {
            return value ? new Intl.DateTimeFormat(LOCALES[lang], { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(value)) : '';
        }
        function planName(order) {
            var key = String(order.audience || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
            var who = /^(student|etudiant)/.test(key) ? t.student : /^(salary|salarie)/.test(key) ? t.salary : '';
            return (order.planLabel || order.plan || 'LinkedIn Premium') + (who ? ' · ' + who : '');
        }
        function wa(text) { return WA_LINK + '?text=' + encodeURIComponent(text); }
        function fill(template, map) { return template.replace(/\{(\w+)\}/g, function (_, k) { return map[k] != null ? map[k] : ''; }); }

        function applyStatic() {
            document.documentElement.lang = lang;
            document.title = t.title + ' · Kareer';
            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('pageSubtitle').textContent = t.subtitle;
            document.getElementById('backLink').textContent = t.back;
            var loading = document.getElementById('loadingText');
            if (loading) loading.textContent = t.loading;
        }

        function showForm(error) {
            container.innerHTML = (error ? '<p class="track-error" style="margin-bottom:14px">' + esc(error) + '</p>' : '') +
                '<form class="track-form" action="suivi.html" method="get"><label for="orderId">' + esc(t.formLabel) + '</label>' +
                '<div class="row"><input id="orderId" name="id" required autocomplete="off" placeholder="KR-XXXXXX" value="' + esc(lookup || '') + '">' +
                '<input type="hidden" name="lang" value="' + lang + '"><button type="submit">' + esc(t.formButton) + '</button></div>' +
                '<p>' + esc(t.formHint) + '</p></form>';
        }

        function render(order) {
            if (order.language && T[order.language] && !params.get('lang')) { lang = order.language; t = T[lang]; applyStatic(); }
            var ref = order.reference || order.sessionId;
            var amount = money(order);
            var st = order.status;
            var refunded = st === 'refunded';
            var linkSent = st === 'awaiting_credentials';
            var credsIn = order.credentialsReceived || st === 'activating' || st === 'done';
            var live = st === 'done';
            var finished = refunded || (live && order.paid);

            var now = refunded ? (order.paid ? t.nowRefunded : t.nowCancelled)
                : live ? (order.paid ? t.nowPaid : t.nowDue)
                : st === 'activating' ? t.nowActivating
                : linkSent ? t.nowLink : t.nowPending;

            var steps = [
                { title: t.s1, desc: linkSent || credsIn ? t.d1done : t.d1, state: 'completed' },
                { title: t.s2, desc: live ? t.d2done : credsIn ? t.d2 : t.d2wait, state: credsIn ? 'completed' : 'active' },
                { title: t.s3, desc: t.d3, state: live ? 'completed' : (credsIn ? 'active' : '') },
                { title: t.s4, desc: order.paid ? t.d4 : t.d4wait, state: order.paid ? 'completed' : (live ? 'active' : '') }
            ];

            var html = '<div class="notice' + (refunded ? ' refunded' : '') + '"><strong>' + esc(ref) + '</strong>' + esc(now) + '</div>';
            if (live && !order.paid) {
                html += '<div class="actions" style="margin:-8px 0 22px"><a class="btn btn-wa" target="_blank" rel="noopener" href="' + wa(fill(t.waPay, { ref: ref, amount: amount })) + '">' + esc(t.payNow) + '</a></div>';
            }
            if (!refunded) {
                html += '<div class="status-timeline">';
                steps.forEach(function (step, i) {
                    html += '<div class="timeline-step ' + step.state + '"><div class="timeline-dot">' + (step.state === 'completed' ? '✓' : i + 1) + '</div><div class="timeline-line"></div>' +
                        '<div class="timeline-info"><h3>' + esc(step.title) + '</h3><p>' + esc(step.desc) + '</p></div></div>';
                });
                html += '</div>';
            }

            html += '<div class="order-details">';
            var rows = [
                [t.order, ref],
                [t.offer, planName(order)],
                [t.amount, amount + (refunded ? '' : ' · ' + (order.paid ? t.paid : t.due))],
                [t.created, date(order.createdAt)],
                [t.activated, date(order.activatedAt)],
                [t.validUntil, live ? date(order.expiresAt) : '']
            ];
            rows.forEach(function (row) {
                if (row[1]) html += '<div class="detail-row"><span class="detail-label">' + esc(row[0]) + '</span><span class="detail-val">' + esc(row[1]) + '</span></div>';
            });
            html += '</div>';

            if (live && order.referralCode) {
                var refUrl = 'https://kareer.pro/?ref=' + encodeURIComponent(order.referralCode);
                html += '<div class="referral-section"><h3>' + esc(t.refTitle) + '</h3><p>' + esc(t.refText) + '</p>' +
                    '<div class="referral-code-box"><span class="referral-code">' + esc(order.referralCode) + '</span>' +
                    '<button class="copy-btn" type="button" data-copy="' + esc(order.referralCode) + '">' + esc(t.copy) + '</button></div>' +
                    '<a class="btn btn-ghost" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(fill(t.refShare, { code: order.referralCode, url: refUrl })) + '">' + esc(t.share) + '</a></div>';
            }

            html += '<p class="help">' + esc(t.help) + ' <a target="_blank" rel="noopener" href="' + wa(fill(t.waHelp, { ref: ref })) + '">' + esc(t.helpLink) + '</a></p>';
            html += '<div class="poll-info">' + (finished ? '' : '<span class="poll-dot"></span>' + esc(t.poll) + ' · ') +
                esc(t.checked) + ' ' + new Date().toLocaleTimeString(LOCALES[lang], { hour: '2-digit', minute: '2-digit' }) + '</div>';
            container.innerHTML = html;

            if (finished && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            return finished;
        }

        container.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-copy]');
            if (!btn) return;
            var code = btn.getAttribute('data-copy');
            if (navigator.clipboard) navigator.clipboard.writeText(code).then(function () {
                btn.textContent = t.copied;
                setTimeout(function () { btn.textContent = t.copy; }, 2000);
            }).catch(function () {});
        });

        function load() {
            return fetch('/api/order-status?id=' + encodeURIComponent(lookup)).then(function (res) {
                if (!res.ok) throw new Error('not_found');
                return res.json();
            });
        }

        applyStatic();
        if (!lookup) { showForm(); return; }
        load().then(function (order) {
            var finished = render(order);
            if (!finished) {
                pollTimer = setInterval(function () { load().then(render).catch(function () {}); }, 60000);
            }
        }).catch(function () { showForm(t.notFound); });
    })();
    </script>
</body>
</html>
