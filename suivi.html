<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de commande · Kareer</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="karrier-logo.png" type="image/png">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --paper: #EEF1F4; --card: #FFFFFF; --ink: #16181B; --ink-2: #4B5058; --ink-3: #6B717A;
            --rule: #CBD2DB; --blue: #1B4DB8; --wa: #1E7A4C; --wa-ink: #165E3A; --danger: #B4351F; --mark: #FFE36E;
            --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
            --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
            /* older names still used inline by the script */
            --warning: var(--danger); --success: var(--wa); --muted: var(--ink-3);
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #121314; --card: #1C1D20; --ink: #EDEAE3; --ink-2: #B3AFA7; --ink-3: #86837D;
                --rule: #2D2F33; --blue: #86A6FF; --wa: #4CC38A; --wa-ink: #6FD6A3; --danger: #F08A73; --mark: #4A3F0A;
                color-scheme: dark;
            }
        }
        body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 48px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        .track-card { width: 100%; max-width: 560px; }
        .track-logo { width: 30px; height: 30px; border-radius: 7px; margin-bottom: 28px; }
        .track-card h1 { font-size: clamp(30px, 6vw, 40px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; }
        .track-subtitle { color: var(--ink-2); margin: 10px 0 28px; }
        #trackContent { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; }
        .progress-container { margin-bottom: 18px; }
        .progress-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
        .progress-labels span.active-label { color: var(--ink); font-weight: 600; }
        .progress-labels span.done-label { color: var(--ink-2); }
        .progress-track { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--ink); transition: width .6s ease; }
        .progress-fill.done { background: var(--wa); }
        .eta-badge { display: inline-block; font-family: var(--mono); font-size: 13px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px; margin-bottom: 22px; color: var(--ink-2); }
        .eta-badge.done { border-color: var(--wa); color: var(--wa); }
        .eta-badge.refunded { border-color: var(--danger); color: var(--danger); }
        .status-timeline { margin-bottom: 22px; }
        .timeline-step { display: flex; align-items: flex-start; gap: 14px; position: relative; padding-bottom: 20px; }
        .timeline-step:last-child { padding-bottom: 0; }
        .timeline-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--card); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink-3); flex-shrink: 0; position: relative; z-index: 1; }
        .timeline-step.active .timeline-dot { border-color: var(--ink); background: var(--ink); color: var(--paper); }
        .timeline-step.completed .timeline-dot { border-color: var(--ink); color: var(--ink); }
        .timeline-line { position: absolute; left: 13px; top: 28px; width: 1px; height: calc(100% - 28px); background: var(--rule); }
        .timeline-step:last-child .timeline-line { display: none; }
        .timeline-info h3 { font-size: 16px; font-weight: 700; color: var(--ink-3); padding-top: 3px; }
        .timeline-info p { font-size: 14px; color: var(--ink-3); }
        .timeline-step.active .timeline-info h3, .timeline-step.completed .timeline-info h3 { color: var(--ink); }
        .timeline-step.active .timeline-info p { color: var(--ink-2); }
        .order-details { border-top: 1px dashed var(--rule); padding-top: 14px; font-family: var(--mono); font-size: 13px; }
        .detail-row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; }
        .detail-label { color: var(--ink-3); }
        .detail-val { color: var(--ink); text-align: right; }
        .referral-section { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--rule); }
        .referral-section h3 { font-size: 17px; margin-bottom: 4px; }
        .referral-section p { font-size: 14px; color: var(--ink-2); margin-bottom: 12px; }
        .referral-code-box { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .referral-code { flex: 1; font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: .08em; padding: 10px 12px; border: 1.5px dashed var(--ink); border-radius: 6px; }
        .copy-btn { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
        .copy-btn:hover { background: var(--ink); color: var(--paper); }
        .wa-share-btn, .wa-support a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--wa); color: var(--wa); border-radius: 6px; text-decoration: none; font-weight: 700; }
        .wa-share-btn:hover, .wa-support a:hover { background: var(--wa); color: var(--paper); }
        .wa-support { margin-top: 16px; }
        .poll-info { margin-top: 16px; font-size: 13px; color: var(--ink-3); }
        .poll-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--wa); margin-right: 4px; vertical-align: middle; }
        .back-link { display: inline-block; margin-top: 22px; color: var(--ink-2); font-size: 15px; }
        .back-link:hover { color: var(--ink); }
        .track-loading { color: var(--ink-3); }
        .track-error { color: var(--danger); }
        .track-form label { display: block; font-weight: 600; margin-bottom: 6px; }
        .track-form .row { display: flex; gap: 8px; }
        .track-form input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border: 1.5px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 15px; }
        .track-form input:focus { outline: none; border-color: var(--blue); }
        .track-form button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .track-form p { margin-top: 8px; font-size: 13px; color: var(--ink-3); }
        @media (prefers-color-scheme: dark) { .track-form button { color: #0E1320; } }
        @media (max-width: 480px) { #trackContent { padding: 18px 16px; } .progress-labels { font-size: 11px; } }
    </style>
</head>
<body>
    <div class="track-card">
        <a href="/"><img src="karrier-logo.png" alt="Kareer" class="track-logo"></a>
        <h1>Suivi de commande</h1>
        <p class="track-subtitle">Où en est l'activation de votre LinkedIn Premium.</p>
        <div id="trackContent">
            <div class="track-loading">Chargement...</div>
        </div>
        <a href="/" class="back-link">Retour au site</a>
    </div>

    <script>
    (function() {
        var container = document.getElementById('trackContent');
        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get('id') || params.get('session_id');
        var pollTimer = null;
        var orderCreatedAt = null;

        if (!sessionId) {
            container.innerHTML = '<form class="track-form" action="suivi.html" method="get"><label for="orderId">Numéro de commande</label><div class="row"><input id="orderId" name="id" required autocomplete="off" placeholder="kareer_business-salary_..."><button type="submit">Suivre</button></div><p>Il commence par kareer_ et figure dans votre message WhatsApp et dans vos e-mails de mise à jour.</p></form>';
            return;
        }

        function fetchOrder() {
            return fetch('/api/order-status?session_id=' + encodeURIComponent(sessionId))
                .then(function(res) {
                    if (!res.ok) throw new Error('not_found');
                    return res.json();
                });
        }

        function render(order, isRefresh) {
            if (!isRefresh) orderCreatedAt = order.createdAt;

            var statusProgressMap = { pending: 10, pending_payment: 10, awaiting_credentials: 35, activating: 70, done: 100, refunded: 100 };
            var pct = statusProgressMap[order.status] || 0;

            var etaText = '';
            var etaCls = order.status;
            if (order.status === 'pending' || order.status === 'pending_payment') {
                etaText = 'Commande reçue, lien sécurisé à venir';
            } else if (order.status === 'awaiting_credentials') {
                etaText = 'En attente de vos accès';
            } else if (order.status === 'activating') {
                etaText = 'Activation en cours, sous 24 à 48 h';
            } else if (order.status === 'done') {
                etaText = 'Premium est actif';
            } else if (order.status === 'refunded') {
                etaText = 'Remboursé';
            }

            // Timeline steps
            var steps = order.status === 'refunded'
                ? [
                    { key: 'pending',   icon: '1', title: 'Commande reçue',   desc: 'Paiement confirmé' },
                    { key: 'refunded',  icon: '2', title: 'Remboursé',         desc: 'Votre commande a été remboursée' }
                  ]
                : [
                    { key: 'pending',    icon: '1', title: 'Commande reçue',       desc: 'Paiement WhatsApp confirmé' },
                    { key: 'activating', icon: '2', title: 'Activation en cours',  desc: 'Votre compte LinkedIn est en cours d\'activation' },
                    { key: 'done',       icon: '3', title: 'Actif',             desc: 'Votre LinkedIn Premium est opérationnel' }
                  ];

            if (order.status !== 'refunded') {
                steps = [
                    { key: 'pending_payment', icon: '1', title: 'Commande reçue', desc: 'Nous préparons le lien sécurisé pour vos accès.' },
                    { key: 'awaiting_credentials', icon: '2', title: 'Accès demandés', desc: 'Un lien sécurisé vous permet de transmettre votre mot de passe LinkedIn.' },
                    { key: 'activating', icon: '3', title: 'Activation en cours', desc: 'Premium est en cours d\'activation sur votre compte LinkedIn.' },
                    { key: 'done', icon: '4', title: 'Actif', desc: 'Votre LinkedIn Premium est opérationnel. Le règlement se fait sur WhatsApp, si ce n\'est pas déjà fait.' }
                ];
            }

            var statusOrder = { pending: 0, pending_payment: 0, awaiting_credentials: 1, activating: 2, done: 3, refunded: 1 };
            var currentIdx = statusOrder[order.status] !== undefined ? statusOrder[order.status] : 0;

            var progressLabelCls = (order.status === 'activating' || order.status === 'awaiting_credentials') ? 'active-label' : '';

            var html = '';

            // Progress bar
            html += '<div class="progress-container">';
            html += '<div class="progress-labels">';
            html += '<span class="' + (currentIdx > 0 ? 'done-label' : '') + '">Commande</span>';
            html += '<span class="' + (order.status === 'awaiting_credentials' ? progressLabelCls : (currentIdx > 1 ? 'done-label' : '')) + '">Accès</span>';
            html += '<span class="' + (order.status === 'activating' ? progressLabelCls : (currentIdx > 2 ? 'done-label' : '')) + '">Activation</span>';
            html += '<span class="' + (order.status === 'done' ? 'done-label' : '') + '">Actif</span>';
            html += '</div>';
            html += '<div class="progress-track"><div class="progress-fill' + (order.status === 'done' ? ' done' : '') + '" id="progressFill" style="width:0%"></div></div>';
            html += '</div>';

            // ETA badge
            html += '<div class="eta-badge ' + etaCls + '">' + etaText + '</div>';

            // Timeline
            html += '<div class="status-timeline">';
            steps.forEach(function(step, i) {
                var cls = '';
                if (i < currentIdx) cls = 'completed';
                else if (i === currentIdx) cls = 'active';
                html += '<div class="timeline-step ' + cls + '">';
                html += '<div class="timeline-dot">' + step.icon + '</div>';
                html += '<div class="timeline-line"></div>';
                html += '<div class="timeline-info"><h3>' + step.title + '</h3><p>' + step.desc + '</p></div>';
                html += '</div>';
            });
            html += '</div>';

            // Order details
            html += '<div class="order-details">';
            html += '<div class="detail-row"><span class="detail-label">Plan</span><span class="detail-val">' + (order.plan || '—') + '</span></div>';
            html += '<div class="detail-row"><span class="detail-label">Audience</span><span class="detail-val">' + (order.audience || '—') + '</span></div>';
            html += '<div class="detail-row"><span class="detail-label">Montant</span><span class="detail-val">' + (order.amount || 0) + ' ' + (order.currency || 'EUR').toUpperCase() + '</span></div>';
            html += '<div class="detail-row"><span class="detail-label">Commande créée</span><span class="detail-val">' + (order.createdAt ? new Date(order.createdAt).toLocaleDateString('fr-FR') : '—') + '</span></div>';
            if (order.expiresAt) {
                html += '<div class="detail-row"><span class="detail-label">Expire le</span><span class="detail-val" style="color:var(--warning)">' + new Date(order.expiresAt).toLocaleDateString('fr-FR') + '</span></div>';
            }
            html += '<div class="detail-row"><span class="detail-label">Dernière mise à jour</span><span class="detail-val">' + (order.updatedAt ? new Date(order.updatedAt).toLocaleString('fr-FR') : '—') + '</span></div>';
            html += '</div>';

            // Referral section (only when done)
            if (order.status === 'done' && order.referralCode) {
                var refUrl = 'https://kareer.pro/?ref=' + order.referralCode;
                var waShareText = encodeURIComponent('J\'ai pris LinkedIn Premium chez Kareer. Avec mon code ' + order.referralCode + ', tu paies 10 € de moins : ' + refUrl);
                html += '<div class="referral-section">';
                html += '<h3>Votre code de parrainage</h3>';
                html += '<p>La personne qui commande avec ce code paie 10 € de moins.</p>';
                html += '<div class="referral-code-box">';
                html += '<span class="referral-code" id="refCode">' + order.referralCode + '</span>';
                html += '<button class="copy-btn" onclick="copyRefCode(\'' + order.referralCode + '\', this)">Copier</button>';
                html += '</div>';
                html += '<a href="https://wa.me/?text=' + waShareText + '" target="_blank" class="wa-share-btn">Partager sur WhatsApp</a>';
                html += '</div>';
            }

            // Poll info
            html += '<div class="poll-info" id="pollInfo">';
            if (order.status !== 'done' && order.status !== 'refunded') {
                html += '<span class="poll-dot"></span> Actualisé toutes les 60 s · ';
            }
            html += 'Vérifié : <span id="lastCheckedTime">' + new Date().toLocaleTimeString('fr-FR') + '</span>';
            html += '</div>';

            // WhatsApp support (show after 48h of pending/activating)
            var showWaSupport = false;
            if ((order.status === 'pending' || order.status === 'pending_payment' || order.status === 'awaiting_credentials' || order.status === 'activating') && orderCreatedAt) {
                var hoursElapsed = (Date.now() - new Date(orderCreatedAt).getTime()) / (1000 * 60 * 60);
                if (hoursElapsed >= 48) showWaSupport = true;
            }
            html += '<div class="wa-support" id="waSupportBlock" style="display:' + (showWaSupport ? 'block' : 'none') + '">';
            html += '<a href="https://wa.me/212651064637" target="_blank">Écrire au support sur WhatsApp</a>';
            html += '</div>';

            container.innerHTML = html;

            // Animate progress bar after DOM insert
            setTimeout(function() {
                var fill = document.getElementById('progressFill');
                if (fill) fill.style.width = pct + '%';
            }, 80);

            // Stop polling when terminal status
            if (order.status === 'done' || order.status === 'refunded') {
                if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            }
        }

        function updateLastChecked() {
            var el = document.getElementById('lastCheckedTime');
            if (el) el.textContent = new Date().toLocaleTimeString('fr-FR');
        }

        // Initial load
        fetchOrder().then(function(order) {
            render(order, false);

            // Start auto-poll every 60s if not terminal
            if (order.status !== 'done' && order.status !== 'refunded') {
                pollTimer = setInterval(function() {
                    fetchOrder().then(function(newOrder) {
                        updateLastChecked();
                        render(newOrder, true);
                    }).catch(function() {
                        updateLastChecked();
                    });
                }, 60000);
            }
        }).catch(function() {
            container.innerHTML = '<div class="track-error">Commande introuvable. Vérifiez votre lien de suivi.</div>';
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (pollTimer) clearInterval(pollTimer);
        });
    })();

    function copyRefCode(code, btn) {
        navigator.clipboard.writeText(code).then(function() {
            btn.textContent = 'Copié';
            setTimeout(function() { btn.textContent = 'Copier'; }, 2000);
        }).catch(function() {
            btn.textContent = 'Copier';
        });
    }
    </script>
</body>
</html>
